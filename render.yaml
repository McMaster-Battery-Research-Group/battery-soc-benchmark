# OPTIONAL Render blueprint — only if you want a paid, always-on cloud worker
# (Render has no free background workers). The zero-cost setup is
# Vercel (web) + Supabase (Postgres) + worker on a lab machine or the
# /api/jobs/run cron endpoint. See README → Deployment.
#
# To also host Postgres on Render, uncomment:
# databases:
#   - name: socbench-db
#     plan: basic-256mb
#     postgresMajorVersion: "16"

services:
  - type: worker
    name: socbench-worker
    runtime: node
    plan: starter            # needs to stay awake to poll the queue
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # Supabase pooled URL (or fromDatabase if using Render Postgres)
      - key: DIRECT_URL
        sync: false
      - key: STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false          # service-role secret from Supabase → Project Settings → API
      - key: SUPABASE_BUCKET
        value: packages
      - key: EVALUATOR
        value: mock          # switch to "matlab" on a machine that has MATLAB Runtime
      - key: MOCK_EVAL_SECONDS
        value: "8"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false          # https://your-vercel-domain — used in result emails
      - key: GOOGLE_ANALYTICS_ID
        sync: false          # GA4 web measurement ID, e.g. G-XXXXXXXXXX
      - key: GOOGLE_ANALYTICS_DEV_API_SECRET
        sync: false          # GA4 Measurement Protocol API secret
      - key: MAIL_FROM
        value: Battery SOC Benchmark <no-reply@batterysocbenchmark.ca>
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
